goal:
  tolerance: 0.2

global_linear_mpc:
  ts: 0.1
  planning_horizon_steps: 100

  q_position: [10.0, 10.0, 10.0]
  q_velocity: [1.0, 1.0, 1.0]
  q_acceleration: [0.1, 0.1, 0.1]

  qn_position: [20.0, 20.0, 20.0]
  qn_velocity: [2.0, 2.0, 2.0]
  qn_acceleration: [0.2, 0.2, 0.2]

  r_jerk: [0.1, 0.1, 0.1]

local_planner:
  ctrl_pt_dist: 0.35
  planning_horizon: 5.0
  collision_weight_increase_factor: 2.0
  max_restart_num: 3

bspline_optimizer:
  lambda_smooth: 1.0
  lambda_dist: 1.0
  lambda_feasibility: 0.1
  lambda_fitness: 1.0
  tol: 1.0e-5
  safe_dist: 0.5

grid_map:
  resolution: 0.1
  map_size: [50, 50, 50]