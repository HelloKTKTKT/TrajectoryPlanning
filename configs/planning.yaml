planner:
  goal_tolerance: 0.2
  ctrl_pt_dist: 0.4
  planning_horizon: 5.0
  collision_weight_increase_factor: 2.0
  max_restart_num: 3
  global_interpoint_dist_thresh: 4.0
  replan_thresh: 1.5
  no_replan_thresh: 0.5
  swarm_clearance: 0.5
  swarm_replan_cooldown: 0.01
  swarm_priority_enabled: true
  safety_check_interval: 0.05
  safety_sample_dt: 0.01
  emergency_time: 1.0
  emergency_vel_threshold: 0.1
  emergency_stop_duration: 1.0
  tracking_enabled: false
  tracking_history_size: 10
  tracking_update_interval: 0.25
  tracking_velocity_deadband: 0.5
  tracking_prediction_time: 1.5
  tracking_goal_update_thresh: 0.4
  tracking_replan_interval: 0.5
  tracking_square_size: 2.0
  tracking_height: 1.5
  tracking_goal_obstacle_margin: 0.2
  tracking_goal_search_step: 0.1
  tracking_goal_search_max_dist: 5.0
  tracking_goal_map_margin: 0.5
  tracking_square_scale_min: 0.8
  tracking_square_scale_max: 3.0
  tracking_square_scale_step: 0.25
  min_tracking_traj_duration: 1.0
  min_tracking_effective_distance: 3.0
  pm_process_planning_interval: 0.05
  pm_process_idle_sleep_time: 0.01
  agent_process_control_interval: 0.01
  agent_process_idle_sleep_time: 0.005

bspline_optimizer:
  lambda_smooth: 1.0
  lambda_dist: 0.5
  lambda_feasibility: 0.1
  lambda_fitness: 1.0
  lambda_swarm: 0.5
  lambda_tracking: 1.0
  tol: 1.0e-5
  safe_dist: 0.5
  swarm_sample_divisor: 5
  tracking_sample_divisor: 5

grid_map:
  resolution: 0.1
  map_size: [100, 100, 30]
  origin: [0.0, 0.0, 0.0]
  obstacles:
    - obs_start_index: [60, 70, 0]
      obs_size: [20, 5, 5]
    - obs_start_index: [60, 70, 25]
      obs_size: [20, 5, 5]      
    - obs_start_index: [60, 70, 5]
      obs_size: [5, 5, 20]
    - obs_start_index: [75, 70, 5]
      obs_size: [5, 5, 20]
    - obs_start_index: [44, 44, 0]
      obs_size: [12, 12, 30]
    - obs_start_index: [20, 70, 0]
      obs_size: [10, 10, 30]
    - obs_start_index: [80, 30, 0]
      obs_size: [10, 10, 30]
    - obs_start_index: [30, 15, 0]
      obs_size: [10, 10, 30]

